
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEMAX.AI</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b0f;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
    }

    h1 {
      text-align: center;
      font-size: 40px;
      letter-spacing: 3px;
    }

    h1 span { color: #8b7cff; }

    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 30px;
    }

    #chat {
      height: 350px;
      overflow-y: auto;
      padding: 15px;
      background: #14141b;
      border: 1px solid #292934;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    .message {
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .user {
      background: #292344;
      text-align: right;
    }

    .ai { background: #22222c; }

    .input-area {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border: 1px solid #333;
      border-radius: 12px;
      background: #17171e;
      color: white;
      font-size: 15px;
    }

    button {
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #8b7cff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    #status {
      color: #999;
      text-align: center;
      font-size: 13px;
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>DEMAX<span>.AI</span></h1>
    <p class="subtitle">Your personal AI assistant.</p>

    <div id="chat">
      <div class="message ai">
        Halo! Aku DEMAX.AI. Ada yang bisa aku bantu?
      </div>
    </div>

    <div class="input-area">
      <input id="question" placeholder="Tanyakan sesuatu..." autocomplete="off">
      <button id="sendButton">Kirim</button>
    </div>

    <div id="status">DEMAX.AI siap digunakan.</div>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
