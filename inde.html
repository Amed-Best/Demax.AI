<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEMAX.AI</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 90%;
      max-width: 600px;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      letter-spacing: 3px;
    }

    h1 span {
      color: #8b7cff;
    }

    p {
      color: #999;
    }

    .chat {
      margin-top: 30px;
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #17171e;
      color: white;
    }

    button {
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #8b7cff;
      color: white;
      font-weight: bold;
    }

    #status {
      margin-top: 20px;
      color: #aaa;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>DEMAX<span>.AI</span></h1>
    <p>Your personal AI assistant.</p>

    <div class="chat">
      <input id="question" placeholder="Tanyakan sesuatu...">
      <button onclick="sendMessage()">Kirim</button>
    </div>

    <div id="status">DEMAX.AI sedang disiapkan.</div>
  </main>

  <script>
    function sendMessage() {
      const question = document.getElementById("question").value.trim();
      const status = document.getElementById("status");

      if (!question) {
        status.textContent = "Tulis pertanyaan terlebih dahulu.";
        return;
      }

      status.textContent =
        "Tampilan DEMAX.AI sudah aktif. Mesin AI lokal akan kita pasang berikutnya.";
    }
  </script>
</body>
</html>
